version: '3.8'

services:
  
  db:
    image: mysql:5.7
    container_name: ps-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: password
    volumes:
      - ps_db_data:/var/lib/mysql
    networks:
      - prestashop-net

  prestashop:
    image: prestashop/prestashop:1.7.8
    container_name: ps-web
    ports:
      - '8080:80'
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASS: password
      PS_DOMAIN: localhost:8080
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - prestashop-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ps-pma
    ports:
      - '8081:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: password
    depends_on:
      - db
    networks:
      - prestashop-net

networks:
  prestashop-net:

volumes:
  ps_db_data: