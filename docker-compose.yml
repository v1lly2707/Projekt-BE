version: '3.8'

services:
  
  db:
    image: mysql:5.7
    container_name: ps-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: password
    volumes:
    - ps_db:/var/lib/mysql
    networks:
      - prestashop-net

  prestashop:
    image: prestashop/prestashop:1.7.8
    container_name: ps-web
    restart: always
    environment:
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWORD: password
      PS_DOMAIN: localhost
      PS_SSL_ENABLED: 1
      PS_SSL_HOST: localhost
      PS_INSTALL_AUTO: 0
    volumes:
    - ps_data:/var/www/html
    - ./src/img:/var/www/html/img
    depends_on:
      - db
    networks:
      - prestashop-net

  nginx:
    image: nginx:latest
    container_name: ps-nginx
    ports:
      - "443:443"
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
    depends_on:
      - prestashop
    networks:
      - prestashop-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ps-pma
    ports:
      - '8081:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: password
    depends_on:
      - db
    networks:
      - prestashop-net

networks:
  prestashop-net:

volumes:
  ps_data:
  ps_db:
